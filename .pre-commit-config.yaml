# .pre-commit-config.yaml
repos:
  # Ruff — быстрый линтер и форматтер
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Указывайте актуальную стабильную версию
    rev: v0.6.9 
    hooks:
      # Линтер (с автоисправлением)
      - id: ruff
        args: [--fix]
      # Форматтер (заменяет Black, если вы не хотите использовать оба)
      - id: ruff-format

  # Mypy — статическая проверка типов
  # - repo: https://github.com/pre-commit/mirrors-mypy
  #   rev: v1.11.2
  #   hooks:
  #     - id: mypy
  #       # Указывайте зависимости, необходимые для анализа типов в вашем проекте
  #       additional_dependencies: [types-requests, types-PyYAML]
  #       args: [--ignore-missing-imports] # Настройте под свой проект

  # Опционально: Black, если вы не хотите использовать ruff-format
  # - repo: https://github.com/psf/black
  #   rev: 24.8.0
  #   hooks:
  #     - id: black
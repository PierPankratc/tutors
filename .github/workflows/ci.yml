name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      
      - name: Install Ruff
        run: pip install ruff==0.4.0
      
      - name: Ruff check
        run: ruff check . --output-format=github
      
      - name: Ruff format check
        run: ruff format --check .